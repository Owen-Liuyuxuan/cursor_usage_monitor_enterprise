name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: bash -n packaging/build_deb.sh
      - run: bash -n packaging/install_user.sh

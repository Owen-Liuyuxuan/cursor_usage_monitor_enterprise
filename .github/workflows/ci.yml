name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNOME Python runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-gi
      - name: Run unit tests
        run: PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests -v
      - run: bash -n packaging/build_deb.sh
      - run: bash -n packaging/install_user.sh
